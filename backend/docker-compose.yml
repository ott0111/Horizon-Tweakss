services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: horizon
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: horizon_dev_only
    ports:
      - "5432:5432"
    volumes:
      - horizon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  horizon-postgres:
